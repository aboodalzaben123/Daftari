<script>
function createCalc(init){
  init=init||{};
  var MAXD=12;
  var SYM={'+':'+','-':'−','*':'×','/':'÷','^':'^','r':'ʸ√'};
  var ERR={div0:'لا يمكن القسمة على صفر',neg:'لا يوجد جذر لعدد سالب',overflow:'النتيجة أكبر من 12 خانة',undef:'القيمة غير معرّفة',domain:'خارج مجال الدالة',syntax:'العملية مكتوبة بشكل ناقص'};
  var NOTICE={nofrac:'لا يوجد كسر مناسب لهذا الرقم',int:'العدد صحيح وليس فيه كسر'};
  var S={cur:'0',acc:null,op:null,awaiting:false,fresh:true,justEq:false,lastOp:null,lastB:null,lastExpr:'',mem:typeof init.mem==='number'&&isFinite(init.mem)?init.mem:0,deg:init.deg===false?false:true,inv:false,mode:'basic',fracMode:null,frac:null,notice:'',err:null,tape:[]};
  if(Array.isArray(init.tape)){init.tape.forEach(function(r){if(r&&typeof r.expr==='string'&&typeof r.res==='string'&&/^-?\d+(\.\d+)?$/.test(r.res)){S.tape.push({expr:r.expr,res:r.res})}});S.tape=S.tape.slice(-80)}
  function round(n){return parseFloat(n.toPrecision(12))}
  function toStr(n){if(!isFinite(n))throw new Error('overflow');n=round(n);if(Math.abs(n)>=1e12)throw new Error('overflow');var s=String(n);if(/e/i.test(s))s=n.toFixed(12).replace(/0+$/,'').replace(/\.$/,'');if(s==='-0'||s===''||s==='-')s='0';return s}
  function fmt(s){var neg=s.charAt(0)==='-';if(neg)s=s.slice(1);var parts=s.split('.');var i=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return(neg?'-':'')+i+(parts.length>1?'.'+parts[1]:'')}
  function f(n){return fmt(toStr(n))}
  function digits(s){return s.replace(/[-.]/g,'').length}
  function val(){return parseFloat(S.cur)}
  function gcd(a,b){while(b){var t=a%b;a=b;b=t}return a}
  function buildFrac(neg,n,d){var w=Math.floor(n/d);return{kind:'frac',neg:neg,n:n,d:d,whole:w,rem:n-w*d}}
  function toFraction(x){
    var neg=x<0,ax=Math.abs(x);var parts=toStr(ax).split('.');
    if(parts.length===1)return{kind:'int'};
    var k=parts[1].length,n,d;
    if(k<=9){n=parseInt(parts[0]+parts[1],10);d=Math.pow(10,k);var g=gcd(n,d);n/=g;d/=g;if(d<=999999)return buildFrac(neg,n,d)}
    var h0=0,h1=1,k0=1,k1=0,y=ax,tol=ax*6e-12;
    for(var i=0;i<40;i++){var a=Math.floor(y),h=a*h1+h0,kk=a*k1+k0;if(kk>9999||h>999999999)break;h0=h1;h1=h;k0=k1;k1=kk;if(Math.abs(ax-h/kk)<=tol)return buildFrac(neg,h,kk);var fr=y-a;if(fr<1e-12)break;y=1/fr}
    return null}
  function fracParts(){var fr=S.frac,sgn=fr.neg?'-':'';if(S.fracMode==='mixed'){return{lead:sgn+(fr.whole>0?fmt(String(fr.whole)):''),top:fmt(String(fr.rem)),bot:fmt(String(fr.d))}}return{lead:sgn,top:fmt(String(fr.n)),bot:fmt(String(fr.d))}}
  function power(a,b){if(a===0&&b<=0)throw new Error('undef');var r=Math.pow(a,b);if(isNaN(r))throw new Error('domain');return r}
  function root(a,b){if(b===0||(a===0&&b<0))throw new Error('undef');if(a<0){if(Number.isInteger(b)&&Math.abs(b)%2===1)return-Math.pow(-a,1/b);throw new Error('domain')}return Math.pow(a,1/b)}
  function compute(a,op,b){if(op==='+')return a+b;if(op==='-')return a-b;if(op==='*')return a*b;if(op==='^')return power(a,b);if(op==='r')return root(a,b);if(b===0)throw new Error('div0');return a/b}
  function pushTape(expr,res){S.lastExpr=expr;S.tape.push({expr:expr,res:res});if(S.tape.length>80)S.tape.shift()}
  function reset(){S.cur='0';S.acc=null;S.op=null;S.awaiting=false;S.fresh=true;S.justEq=false;S.lastOp=null;S.lastB=null;S.lastExpr='';S.inv=false;S.fracMode=null;S.frac=null;S.notice='';S.err=null}
  function handle(k){
    var v,r,rs,b,a;
    S.notice='';
    if(k!=='FRAC'&&k!=='DEG'&&k!=='INV')S.fracMode=null;
    if(k==='POW')k='^';
    if(k==='ROOT')k='r';
    if(k==='LN'||k==='LOG'||k==='EXP'||k==='TEN'||k==='SQ'||k==='CBRT'||k==='RECIP'||k==='FACT'){
      v=val();var label;
      if(k==='LN'){if(v<=0)throw new Error('domain');r=Math.log(v);label='ln('+f(v)+')'}
      else if(k==='LOG'){if(v<=0)throw new Error('domain');r=Math.log10(v);label='log('+f(v)+')'}
      else if(k==='EXP'){r=Math.exp(v);label='e^('+f(v)+')'}
      else if(k==='TEN'){r=Math.pow(10,v);label='10^('+f(v)+')'}
      else if(k==='SQ'){r=v*v;label=f(v)+'²'}
      else if(k==='CBRT'){r=Math.cbrt(v);label='∛('+f(v)+')'}
      else if(k==='RECIP'){if(v===0)throw new Error('div0');r=1/v;label='1/('+f(v)+')'}
      else{if(v<0||!Number.isInteger(v))throw new Error('domain');if(v>20)throw new Error('overflow');r=1;for(var q=2;q<=v;q++)r*=q;label=f(v)+'!'}
      rs=toStr(r);pushTape(label,rs);S.cur=rs;S.fresh=true;S.awaiting=false;S.justEq=false;return}
    if(k==='FRAC'){
      if(S.fracMode==='mixed'){S.fracMode='improper';return}
      if(S.fracMode==='improper'){S.fracMode=null;return}
      var fr=toFraction(val());
      if(fr===null){S.notice='nofrac';return}
      if(fr.kind==='int'){S.notice='int';return}
      S.frac=fr;S.fracMode=fr.whole>0?'mixed':'improper';S.fresh=true;S.awaiting=false;return}
    if(k==='PI'){S.cur=toStr(Math.PI);S.fresh=true;S.awaiting=false;S.justEq=false;return}
    if(k==='DEG'){S.deg=!S.deg;return}
    if(k==='INV'){S.inv=!S.inv;return}
    if(k==='SIN'||k==='COS'||k==='TAN'){
      v=val();var nm=k.toLowerCase(),arg;
      if(!S.inv){var x=S.deg?v*Math.PI/180:v;if(k==='SIN')r=Math.sin(x);else if(k==='COS')r=Math.cos(x);else{if(Math.abs(Math.cos(x))<1e-10)throw new Error('undef');r=Math.tan(x)}arg=f(v)+(S.deg?'°':'')}
      else{if(k!=='TAN'&&Math.abs(v)>1)throw new Error('domain');r=k==='SIN'?Math.asin(v):k==='COS'?Math.acos(v):Math.atan(v);if(S.deg)r=r*180/Math.PI;nm+='⁻¹';arg=f(v)}
      rs=toStr(r);pushTape(nm+'('+arg+')',rs);S.cur=rs;S.fresh=true;S.awaiting=false;S.justEq=false;S.inv=false;return}
    if(/^[0-9]$/.test(k)){
      if(S.fresh){S.cur=k;S.fresh=false;S.justEq=false}
      else if(digits(S.cur)<MAXD){S.cur=S.cur==='0'?k:S.cur+k}
      S.awaiting=false;return}
    if(k==='.'){
      if(S.fresh){S.cur='0.';S.fresh=false;S.justEq=false}
      else if(S.cur.indexOf('.')<0&&digits(S.cur)<MAXD){S.cur+='.'}
      S.awaiting=false;return}
    if(k==='+'||k==='-'||k==='*'||k==='/'||k==='^'||k==='r'){
      if(S.op!==null&&S.awaiting){S.op=k;return}
      v=val();
      if(S.op!==null){r=compute(S.acc,S.op,v);rs=toStr(r);pushTape(f(S.acc)+' '+SYM[S.op]+' '+f(v),rs);S.acc=parseFloat(rs);S.cur=rs}
      else{S.acc=v}
      S.op=k;S.awaiting=true;S.fresh=true;S.justEq=false;S.lastOp=null;return}
    if(k==='='){
      if(S.op!==null){b=val();rs=toStr(compute(S.acc,S.op,b));pushTape(f(S.acc)+' '+SYM[S.op]+' '+f(b)+' =',rs);S.lastOp=S.op;S.lastB=b;S.acc=null;S.op=null}
      else if(S.lastOp!==null){a=val();rs=toStr(compute(a,S.lastOp,S.lastB));pushTape(f(a)+' '+SYM[S.lastOp]+' '+f(S.lastB)+' =',rs)}
      else{return}
      S.cur=rs;S.fresh=true;S.awaiting=false;S.justEq=true;return}
    if(k==='%'){
      v=val();
      if(S.op!==null&&S.acc!==null&&'+-*/'.indexOf(S.op)>=0){

if(s in e&&e[s]&&(e[s].fn||e[s].b))return F(e[s],A.map(x=>ev(x,e)))}
return F(ev(h,e),A.map(x=>ev(x,e)))}}U()}

ير غلط."],["شرط if","const x = -3;\nif (x > 0) console.log(\"موجب\");\nelse if (x === 0) console.log(\"صفر\");\nelse console.log(\"سالب\");","استعمل === للمقارنة (مش = لأنها للإسناد)."],["حلقة while","let n = 1, s = 0;\nwhile (n <= 10) {\n  s += n;\n  n++;\n}\nconsole.log(s);","هاد بيجمع 1 + 2 + ... + 10."]]],["Numbers|Math & primes",[["كائن Math","console.log(Math.sqrt(16), Math.PI, Math.sin(Math.PI / 2), Math.abs(-3), Math.round(2.6));","Math.cos, Math.log, Math.exp, Math.pow, Math.floor, Math.ceil وغيرهم."],["أعداد أولية","const isPrime = n => {\n  if (n < 2) return false;\n  for (let d = 2; d * d <= n; d++) {\n    if (n % d === 0) return false;\n  }\n  return true;\n};\nconsole.log([...Array(28).keys()].map(k => k + 2).filter(isPrime));","Array(28).keys() بتعطي 0..27، منزيد عليها 2 ومنفلتر الأولية."]]]];

function wlHelp(insert,hold,DATA,TTL){const HD=DATA||WLHELP;document.querySelectorAll('.wlhp').forEach(e=>e.remove());const ov=mk('div','panel wlhp');ov.style.cssText='position:fixed;z-index:60;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));bottom:8px;overflow:auto;direction:rtl;padding:12px;max-width:760px;margin:0 auto';
['pointerdown','touchstart','mousedown'].forEach(n=>ov.addEventListener(n,e=>{hold(1);e.stopPropagation()}));
const hd=mk('div','row');hd.style.cssText='position:sticky;top:-12px;background:var(--card);padding:8px 0;margin-top:-12px;z-index:2;justify-content:space-between';const cl=mk('button','','✕ إغلاق');cl.onclick=()=>{ov.remove();hold(0)};hd.append(mk('b','',TTL||'📖 تعليمات أكواد الرسم (Plot)'),cl);ov.append(hd);
ov.append(mk('div','st','اضغط «إدراج» وبينحط المثال بالكود، وبعدين عدّل عليه ونفّذه بـ ▶.'));
const ORD=['Functions','Plot','Derivative','Integral','Algebra','Matrices','Equations','Lists','Programming','Numbers'];HD.sort((p,q)=>ORD.indexOf(p[0].split('|')[0])-ORD.indexOf(q[0].split('|')[0]));const cats=[...new Set(HD.map(q=>q[0].split('|')[0]))],chips=mk('div','row'),secs=[];chips.style.cssText='flex-wrap:wrap;gap:6px;margin:6px 0';const showC=c=>{secs.forEach(w=>{w.style.display=(!c||w.dataset.c===c)?'':'none'});[...chips.children].forEach(b=>b.classList.toggle('primary',(b.dataset.c||'')===(c||'')))};['',...cats].forEach(c=>{const b=mk('button','',c||'All');b.dataset.c=c;b.onclick=()=>showC(c);chips.append(b)});ov.append(chips);HD.forEach(sec=>{const[ct,tt]=sec[0].split('|'),w=mk('div','');w.dataset.c=ct;secs.push(w);w.append(mk('div','sec',ct+' · '+tt));sec[1].forEach(r=>{const bx=mk('div','');bx.style.cssText='border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0';bx.append(mk('b','',r[0]));if(r[2]){const n=mk('div','st',r[2]);n.style.marginTop='3px';bx.append(n)}if(r[1]){const pre=mk('pre','',r[1]);pre.style.cssText='margin:6px 0;padding:6px 8px;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:8px;font:13px ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text';const bt=mk('button','primary','إدراج');['pointerdown','mousedown','touchstart'].forEach(n=>bt.addEventListener(n,e=>{hold(1);if(n!=='touchstart')e.preventDefault()},{passive:false}));let _dn=0;const _go=e=>{if(e.type==='click'&&_dn){_dn=0;return}if(e.type==='pointerup'){_dn=1;setTimeout(()=>{_dn=0},700)}e.preventDefault();e.stopPropagation();try{insert(r[1])}catch(er){}ov.remove();hold(0);gs('انحط المثال بالكود ✓')};bt.addEventListener('pointerup',_go);bt.addEventListener('click',_go);bt.style.touchAction='manipulation';bx.append(pre,bt)}w.append(bx)});ov.append(w)});showC('');

const WLCOL={Red:'#e02424',Blue:'#1c4fe0',Green:'#18a34a',Black:'#111111',Gray:'#808080',Orange:'#f58a07',Purple:'#8030a0',Brown:'#996633',Pink:'#f472b6',Yellow:'#eab308',Cyan:'#06b6d4',Magenta:'#d61fc4',LightGray:'#c8c8c8',DarkGray:'#555555'};
function wlHex(a){return'#'+a.map(v=>Math.round(Math.max(0,Math.min(1,v))*255).toString(16).padStart(2,'0')).join('')}
function wlDir(x,o,nm,tw){x=String(x).trim();if(!x)return;const L=wlList(x);if(L){L.forEach(y=>wlDir(y,o,nm,tw));return}
const m=/^(\w+)\[([\s\S]*)\]$/.exec(x);
if(m){const n=m[1],a=wlParts(m[2]);
if(n==='Directive'){a.forEach(y=>wlDir(y,o,nm,tw));return}
if(n==='RGBColor'){let c=a.length===1&&wlList(a[0])?wlList(a[0]):a;c=c.map(nm);if(c.length>=3&&c.slice(0,3).every(isFinite)){o.c=wlHex(c.slice(0,3));return}}
else if(n==='GrayLevel'){const g=nm(a[0]);if(isFinite(g)){o.c=wlHex([g,g,g]);return}}

let ov=null,qIn=null,bodyEl=null,chipsEl=null;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function icoFor(k){
  try{
    const f=String(k).split(' ')[0];let src=null;
    if(f.indexOf('t:')===0)src=document.querySelector('#tools [data-t="'+f.slice(2)+'"]:not([data-x]) svg');
    else if($(f))src=$(f).querySelector('svg');
    if(src){const c=src.cloneNode(true);c.removeAttribute('width');c.removeAttribute('height');return c}
  }catch(e){}
  return null;
}
function build(){
  ov=el('div');ov.id='gdOv';ov.hidden=true;
  const p=el('div');p.id='gdP';
  const h=el('div');h.id='gdH';
  const t=el('b','','📖 دليل التطبيق');
  const hb=el('button','','❓ جرّب وضع المساعدة');hb.onclick=()=>{closeGuide();setHelp(true)};
  const x=el('button','','✕');x.onclick=closeGuide;
  h.append(t,hb,x);
  qIn=el('input');qIn.id='gdQ';qIn.type='search';qIn.placeholder='🔍 دوّر على أداة أو ميزة…';qIn.oninput=()=>render();
  chipsEl=el('div');chipsEl.id='gdC';
  bodyEl=el('div');bodyEl.id='gdB2';
  p.append(h,qIn,chipsEl,bodyEl);ov.append(p);
  ov.addEventListener('click',e=>{if(e.target===ov)closeGuide()});
  document.body.append(ov);
}
const norm=s=>String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function render(focusKey){
  const q=norm(qIn.value.trim());
  bodyEl.textContent='';chipsEl.textContent='';
  let shown=0,target=null;
  DATA.forEach(s=>{
    const its=s.items.filter(it=>!q||norm(it.n+' '+it.t+' '+(it.tip||'')+' '+s.t).indexOf(q)>=0);
    if(!its.length)return;
    const chip=el('button','',s.ic+' '+s.t);
    const sec=el('div','gdS',s.ic+' '+s.t);sec.id='gd-'+s.id;
    chip.onclick=()=>{sec.scrollIntoView({block:'start',behavior:'smooth'})};
    chipsEl.append(chip);bodyEl.append(sec);
    its.forEach(it=>{
      shown++;
      const c=el('div','gdI'),n=el('div','gdN');
      const ic=icoFor(it.k);if(ic)n.append(ic);n.append(document.createTextNode(ic?it.n.replace(/^[^\u0600-\u06FFa-zA-Z0-9]+\s*/,''):it.n));
      c.append(n,el('div','gdT',it.t));
      if(it.tip)c.append(el('div','gdP2','💡 '+it.tip));
      bodyEl.append(c);
      if(focusKey&&String(it.k).split(' ').indexOf(focusKey)>=0&&!target)target=c;
    });
  });
  if(!shown)bodyEl.append(el('div','gdE','ما لقيت شي بهالكلمة. جرّب كلمة تانية، مثلًا: ممحاة، تحديد، PDF، مشاركة.'));

}

const MODEK=[['[data-lm]','lm:','lm'],['#erM [data-m]','er:','m'],['#lzM [data-m]','lz:','m'],['[data-tm]','tm:','tm']];
function keyOf(t){

  for(const [sel,pre,at] of MODEK){const b=t.closest(sel);if(b)return {k:pre+b.dataset[at],el:b}}
  const tb=t.closest('[data-t]');if(tb)return {k:'t:'+tb.dataset.t,el:tb};
  const sw=t.closest('.sw');if(sw&&!sw.closest('#dlg'))return {k:'sw',el:sw};
  if(t.closest('.tb,.tplus'))return {k:'tab',el:t.closest('.tb,.tplus')};
  if(t.closest('#vbar button'))return {k:'vbar',el:t.closest('#vbar button')};
  if(t.closest('#tagbar button'))return {k:'tag',el:t.closest('#tagbar button')};
  if(t.closest('.mn'))return {k:'bkmenu',el:t.closest('.mn')};
  if(t.closest('.bk'))return {k:'bk',el:t.closest('.bk')};
  for(let e=t;e&&e!==document.body;e=e.parentElement){if(e.id&&IDX[e.id])return {k:e.id,el:e}}
  const tt=t.closest('button[title],[title]');if(tt&&tt.getAttribute('title'))return {k:null,el:tt,title:tt.getAttribute('title')};
  if(t.closest('#view,#pages,.page'))return {k:'x:page',el:null};

}
