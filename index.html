## ما هي المعادلة التربيعية؟
نسمّي المعادلة تربيعية إذا كان أعلى أس للمجهول فيها هو 2.

\\begin{تعريف}
المعادلة التربيعية هي معادلة صورتها العامة:
$$ax^2+bx+c=0,\\quad a\\neq 0$$
\\end{تعريف}

## القانون العام
\\begin{قانون}
$$x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$$
\\end{قانون}

\\begin{مثال}
حل المعادلة \\(x^2-5x+6=0\\)
هنا \\(a=1,\\ b=-5,\\ c=6\\) إذن:
$$x=\\frac{5\\pm\\sqrt{25-24}}{2}$$

<script id="guidejs">(function(){if(window.__GUIDE)return;window.__GUIDE=1;const w=t=>document.getElementById(t),E=[{id:"wr",ic:"✍️",t:"الأقلام والكتابة",items:[{k:"t:pen",n:"✒️ حبر",t:"القلم الأساسي للكتابة. سماكة الخط بتتغيّر مع قوة الضغط وسرعة إيدك، فبيطلع خطك طبيعي.",tip:"غيّر اللون والسماكة من الدايرة الملونة وزر السماكة اللي بجنب الأدوات."},{k:"t:ball",n:"🖊 جاف",t:"خط بسماكة ثابتة ما بتتأثر بالضغط. مناسب لكتابة مرتّبة ومتساوية.",tip:"لو مش ظاهر بالشريط، اختاره من قائمة الأقلام (زر الأقلام بآخر مجموعة الأقلام)."},{k:"t:fine",n:"✏️ قلم رفيع",t:"أنحف قلم بالشريط، بسماكة ثابتة. للتفاصيل الدقيقة والكتابة الصغيرة."},{k:"t:pencil",n:"✏️ رصاص",t:"خط أنحف وشبه شفاف شوي، وسماكته بتتغيّر مع الضغط."},{k:"t:marker",n:"🖍 ماركر",t:"خط عريض بسماكة ثابتة ولون شبه شفاف شوي. للعناوين وإبراز الكلمات."},{k:"t:brush",n:"🖌 فرشاة",t:"خط عريض وسماكته بتتغيّر مع الضغط والسرعة. للعناوين الكبيرة والخط الفنّي."},{k:"t:hand",n:"✍️ خط يدي",t:"سماكة ثابتة وأعرض شوي من القلم العادي."},{k:"t:hl",n:"🟨 تظليل",t:"تظليل شفاف فوق الكتابة أو النص. لما تختاره بتطلع خيارات: الشفافية، و«مؤقت» (التظليل بيختفي بعد ثواني، مفيد بالشرح والعرض)، و«التصاق بالنص» (بيلصق التظليل بسطور النص بصفحات الـ PDF والصور).",tip:"لون التظليل الافتراضي أصفر، وبتغيّره من لوحة الألوان."},{k:"hlT",n:"⏱ تظليل مؤقت",t:"التظليل بيختفي لحاله بعد ثواني. مفيد وإنت بتشرح لحدا. بتحدّد المدة من شريط «المدة»."},{k:"hlS",n:"🧲 التصاق بالنص",t:"بيلصق التظليل بسطور النص تلقائيًا (صفحات الـ PDF والصور)، فما بتحتاج تظبّط الخط بإيدك."},{k:"t:laser",n:"🔴 قلم ليزر",t:"للإشارة والشرح قدام الناس. اللي بترسمه ما بينحفظ بالصفحة. لونه بتختاره من شريط الألوان تحت الأدوات (زي باقي الأقلام)، والوضع (يتلاشى / ثابت / عائم) والحجم والمدة من زر الإعدادات اللي جنب الألوان. الخط بيلتصق بالصفحة وبيتحرك معها. لتحويل الرسمة لشكل منتظم (خط، دائرة، مستطيل، مضلع…) بوضع «ثابت»: ثبّت القلم آخر الرسمة، وبعدها حرّك إصبعك لتدويره وتكبيره. من الإعدادات بتشغّل «↗ سهم» فبيصير الخط المستقيم سهم. لمسحه فوراً: زر 🧹 الصغير اللي بيظهر تحت يسار الشاشة بوضع «ثابت»، أو 🧹 امسح الليزر بقائمة الإعدادات، أو مفتاح Esc."},{k:"lz:fade lz:hold lz:hover",n:"🔴 أوضاع الليزر",t:"يتلاشى، ثابت، عائم: ثلاث طرق لظهور خط الليزر. جرّبهم واختار اللي بيناسب طريقة شرحك. المدة بتتحكم بكم ثانية بيضل ظاهر."},{k:"penB",n:"➕ قائمة الأقلام وترتيبها",t:"بتفتح كل الأقلام. بتقدر تثبّت أي قلم بالشريط بلونه وسماكته الحاليين (لحد ١٢ قلم)، وتحرّك الأقلام بالأسهم ◀ ▶، وتشيل المثبّت بـ ✕.",tip:"لو ثبّتت عدة أقلام بألوان مختلفة بتوفّر على حالك تغيير اللون كل شوي."},{k:"x:penedit",n:"↔ ترتيب الأقلام بالسحب",t:"اضغط مطوّلًا على أي قلم بالشريط وبتبدأ الأزرار تهتز. اسحب القلم لمكان تاني، أو اضغط − لإزالته، واضغط بأي مكان للإنهاء. لازم يضل قلم واحد على الأقل."},{k:"sw stB",n:"🎨 اللون والسماكة",t:"الدايرة الملونة بتغيّر لون القلم، وزر السماكة بيفتح شريط السماكة (وللتظليل كمان الشفافية). لوحة الألوان بتتسع لحد ١٤ لون، ولازم يضل فيها ٣ على الأقل."},{k:"t:eraser",n:"🧽 ممحاة",t:"بتمحي من الصفحة. بتختار شو تمحي: حبر وأشكال، أو تظليل، أو كل شي، أو صور/نص. وبتختار الطريقة: نقطية (بتمحي الجزء اللي بتمرّ عليه بس) أو الخط كامل (لمسة وحدة بتشيل الخط كله).",tip:"إذا غلطت، زر التراجع ↩ بيرجّع المحي."},{k:"er:ink er:hl er:all er:media",n:"🧽 الممحاة: نوع اللي بتمحيه",t:"حبر وأشكال: بتمحي الكتابة والرسم بس. تظليل: بتمحي التظليل بس. كل شي: بتمحي كل شي. صور/نص: بتمحي الصور والنصوص المكتوبة."},{k:"erP",n:"🧽 الممحاة: طريقة المسح",t:"نقطية: بتمحي الجزء اللي بتمرّ عليه بس. الخط كامل: أي لمسة على خط بتشيله كله."},{k:"erS",n:"🧽 حجم الممحاة",t:"حرّك الشريط لتكبّر أو تصغّر الممحاة."},{k:"spB",n:"↕ إدراج مسافة",t:"ارسم خط أفقي بين سطرين وثبّت القلم (بيتحوّل لخط مستقيم)، وضلّك ثابت نص ثانية كمان لحد ما يزرق الخط، وبعدين اسحب لتحت: كل اللي تحت الخط بينزاح وبتنفتح مسافة. اسحب لفوق لتصغيرها. ارفع القلم للتثبيت.",tip:"التراجع بيرجّعها. لو رفعت بدون سحب بيضل الخط كخط عادي."},{k:"scrB",n:"✍ خربشة وتثبيت = مسح",t:"بأي قلم: اخربش ذهاب وإياب فوق الكتابة وضلّ ضاغط حوالي نص ثانية بدون ما ترفع القلم، وبينمسح الحبر والأشكال اللي تحت الخربشة. التراجع بيرجّعها. التظليل والعناصر المقفولة ما بتنمسح.",tip:"بتشغّلها أو بتطفّيها من زر «✍ خربشة تمسح» بإعدادات الأقلام (الزر اللي جنب الألوان) مع أقلام الكتابة."},{k:"t:tap",n:"👆 تفاعل",t:"للصفحات الحيّة (صفحات HTML فيها أزرار وروابط). بتخليك تضغط الأزرار والروابط بدل ما ترسم عليها. اختار أي قلم وبترجع تكتب.",tip:"فوق الصفحة الحيّة زر ↺ بيرجّعها لحالتها الأصلية (بدّه ضغطتين للتأكيد)."}]},{id:"sh",ic:"📐",t:"الأشكال والمسطرة",items:[{k:"t:line",n:"╱ خط مستقيم",t:"اسحب لرسم خط مستقيم، وحرّكه للتعديل، وارفع إصبعك للتثبيت."},{k:"t:rect",n:"▭ مستطيل",t:"اسحب لرسم مستطيل. اثبت بآخر السحب لحظة وبيتنظّم الشكل."},{k:"t:ell",n:"⭕ دائرة / قطع ناقص",t:"اسحب لرسم دائرة أو قطع ناقص. اثبت بآخر السحب لحظة وبيتنظّم الشكل."},{k:"shpB",n:"🔷 قائمة الأشكال",t:"فيها: خط، مستطيل، دائرة، سهم، مثلث، معيّن، مثلث متساوي الأضلاع، مثلث قائم، خماسي، سداسي، ثماني، متوازي أضلاع، شبه منحرف، طائرة ورقية، نجمة. وكمان محاور x و y: مع شبكة، أو بدون تقسيم.",tip:"بعد الرسم: دوّر إصبعك حوالين الشكل لتدويره بحرية، قرّب أو بعّد لتغيير الحجم، وارفع للتثبيت."},{k:"rulB",n:"📏 مسطرة",t:"بتظهر مسطرة فوق الصفحة. ارسم بالقلم على حافتها وبيطلع خط مستقيم. اضغط الزر مرة ثانية لإخفائها."}]},{id:"sl",ic:"✂️",t:"التحديد والتعديل",items:[{k:"t:lasso",n:"⭕ تحديد",t:"بتحدّد عناصر الصفحة (كتابة، أشكال، صور، نصوص) عشان تحرّكها، تكبّرها، تدوّرها أو تعدّل عليها. فيه ٣ طرق للتحديد: حر (ارسم حلقة)، مربع (اسحب مستطيل)، عناصر (المس عنصر لتحديده، ولمسة ثانية بتضيف أو بتشيل)."},{k:"lm:free lm:rect lm:items",n:"⭕ طرق التحديد",t:"حر: ارسم حلقة حوالين اللي بدك ياه. مربع: اسحب مستطيل. عناصر: المس العنصر لتحدده، ولمسة ثانية بتضيف أو بتشيل من التحديد."},{k:"lsAll",n:"☑ الكل",t:"بيحدّد كل شي بالصفحة."},{k:"lsPaste2 lsPaste lsPst",n:"📥 لصق",t:"بيلصق اللي نسخته: عناصر من الصفحة، أو صورة من الحافظة.",tip:"ضغطة مطوّلة على الصفحة بتطلّع خيار اللصق."},{k:"lsOpt",n:"⋯ خيارات التحديد",t:"تحديد حسب النوع أو اللون. وتشغيل أو إطفاء المحاذاة المغناطيسية (بتلصق العناصر بحواف ومنتصف الصفحة والعناصر التانية)."},{k:"lsDel",n:"🗑 حذف",t:"بيحذف العناصر المحدّدة (زر التراجع بيرجّعها)."},{k:"lsCol",n:"🎨 ستايل",t:"بتغيّر لون وسماكة وشفافية العناصر المحدّدة."},{k:"lsMO",n:"🔒 تحريك فقط",t:"بيخفي مقابض التكبير والتدوير، عشان ما تغيّر الحجم بالغلط وإنت بس بدك تنقل."},{k:"lsDup",n:"⧉ تكرار",t:"بينسخ المحدّد جنب الأصل."},{k:"lsInk",n:"✒ حوّل لحبر",t:"بيحوّل الرسمة (شكل) لحبر عادي، فبتقدر تمحيه وتعدّل عليه متل أي كتابة."},{k:"lsMs",n:"📐 قياسات",t:"بتعرض أطوال وزوايا ومساحة حيّة للشكل. عرض الصفحة = ٢٠ سم، ولما تمدّ الشكل الأرقام بتتحدّث."},{k:"lsSolve",n:"🧮 حلّ (للتمرين المحدّد)",t:"بيحلّ التمرين المحدّد وبيكتب جوابه تحته (الجواب بيطلع أخضر). بيحتاج إنترنت."},{k:"lsCopy",n:"📋 نسخ",t:"بينسخ المحدّد (للصقه بمكان تاني، أو بدفتر تاني)."},{k:"lsX2",n:"⇆ للدفتر الثاني",t:"بينسخ أو بينقل المحدّد للدفتر اللي بالجهة التانية (بوضع تقسيم الشاشة)."},{k:"lsMore",n:"⋯ المزيد",t:"خيارات إضافية للتحديد: قص، أمام / خلف، قلب أفقي / عمودي، قفل، عكس التحديد، لصق."},{k:"lsCut lsFront lsBack lsFH lsFV lsLock lsInv lsCm lsUnl",n:"⋯ خيارات المزيد",t:"✂ قص. ⬆ أمام / ⬇ خلف: ترتيب العناصر فوق بعض. ⇋ قلب أفقي، ⇅ قلب عمودي. 🔒 قفل: بيثبّت العنصر عشان ما يتحرّك. ⇄ عكس: بيحدّد كل اللي مش محدّد. ◎ المركز: بيظهر أو بيخفي مركز الشكل. فك القفل: من خيارات التحديد."},{k:"lsX",n:"✕ إغلاق التحديد",t:"بيلغي التحديد."},{k:"t:tsel",n:"📝 تحديد نص",t:"بيحدّد نص صفحات الـ PDF أو الـ HTML بس: ارسم حلقة حوالين النص اللي بدك ياه (ما بيمسك أي شي ثاني). بعدها بتقدر تظلّل النص أو تحذفه. بتختار حلقة حرة أو مربع. وزر ✋ تحريك بيحوّل اللي بتحيطه (نص أو رسوم) لقطعة بتحركها، ولما يكون شغّال بيظهر زر 🎨/🖼 بيبدّل القطعة بين خلفية شفافة ومع خلفيتها الأصلية."},{k:"hm:free hm:rect hm:round",n:"🟨 شكل التظليل",t:"حر: تظليل بالإيد. مستطيل: اسحب من زاوية للزاوية المقابلة وتتحكّم بالأبعاد. مقوّس: نفس المستطيل بس حوافه بقوس خفيف. بتقدر تحرّكه وتكبّره بعدين من أداة التحديد."},{k:"tm:free tm:rect",n:"📝 شكل تحديد النص",t:"حلقة حرة: ارسم دايرة حوالين النص. مربع: اسحب مستطيل حوالين النص."},{k:"x:capture",n:"📸 لقطة للمنطقة",t:"بأداة التحديد: ضغطة مطوّلة ثم سحب = لقطة للمنطقة. بتنحط صورة بتقدر تحرّكها، تكبّرها، وتدوّرها."}]},{id:"mt",ic:"∑",t:"النص والرياضيات",items:[{k:"t:text",n:"🔤 نص",t:"اضغط على الصفحة لكتابة نص، أو على نص موجود لتعديله. فيه تنسيق (عريض، محاذاة، قوائم…).",tip:"اضغط على النص مرة ثانية، أو على ✏️ تعديل، عشان تكتب."},{k:"t:math",n:"∑ رياضيات",t:"اضغط لكتابة معادلة (لاتيكس) أو كود، أو على عنصر موجود لتعديله. فيه كتالوج: قوالب، صناديق (تعريف، نظرية، مثال، برهان، ملاحظة، تنبيه)، كود وحساب (WL وPython وJS)، وكتيبات (Mathematica وLaTeX وPython وJS).",tip:"أول مرة بدّه إنترنت عشان يحمّل MathJax، وبعدها بيشتغل بدون نت."},{k:"t:solve",n:"🧮 حلّ",t:"المس أي تمرين (صورة صيغة لاتيكس أو نص) وبينكتب جوابه تحته، بلون أخضر. بيحتاج إنترنت."},{k:"calcB",n:"🧮 الحاسبة والاقترانات",t:"حاسبة وبرنامج رسم اقترانات. بتفتحها من زر 🧮 بالشريط العلوي، أو بتثبّتها بجنب الدفتر بتقسيم الشاشة.",tip:"لإدراج رقم أو نتيجة بالصفحة: اضغط «أدرج النتيجة»، أو اسحب الرقم وأفلته فوق الصفحة."},{k:"tc tg",n:"🧮 آلة حاسبة / رسم اقترانات",t:"التبويبين بداخل الحاسبة: «آلة حاسبة» للحسابات، و«رسم اقترانات» لرسم لحد ٢٠ اقتران. المس أي منحنى وحرّك إصبعك عليه لتشوف النقاط، وتثبّت المماس. وكمان بتقدر ترسم منحنى بإصبعك وبيطلعلك اقترانه."},{k:"kz0 kz1",n:"🧮 تصغير / تكبير الحاسبة",t:"بيصغّر أو بيكبّر الحاسبة كلها.",tip:"بتقدر كمان تغيّر الطول والعرض بسحب الزاوية ◢ (نقرتين = الحجم الأصلي)."},{k:"kdk",n:"◧ تثبيت الحاسبة بالجنب",t:"بيثبّت الحاسبة بجنب الدفتر (تقسيم الشاشة). اضغطه مرة ثانية لتفكّها."},{k:"kmn kbub",n:"▁ طيّ الحاسبة لفقاعة",t:"بيطوي الحاسبة لفقاعة صغيرة بتعرض آخر نتيجة. اسحب الفقاعة لتنقلها، واضغطها لترجع الحاسبة."},{k:"cIns",n:"📌 أدرج النتيجة بالصفحة",t:"بيحط نتيجة الحاسبة بالصفحة اللي قدامك."},{k:"tgeo",n:"📐 هندسة",t:"تبويب بالحاسبة لرسم نقاط وقطع ومثلثات ودوائر، وقياس الزوايا والأطوال، وكمان تلصق نقطة على شكل (دائرة أو مستقيم أو مثلث…) بزر 📎 فتتحرك عليه بس، وتفكها بزر ⛓ إلغاء اللصق. اختار الأداة واضغط على المكان، وبعدين أدرج الرسم بالصفحة كصورة."},{k:"kx",n:"✕ إغلاق الحاسبة",t:"بيسكّر الحاسبة."},{k:"kdrag",n:"⠿ تحريك الحاسبة",t:"اسحب من هون لتنقل الحاسبة عن مكانها."},{k:"x:plot",n:"📈 رسم دالة (من زر ＋ إضافة)",t:"اكتب الاقتران والمجال بس، وبينرسم داخل الصفحة. بعدها حدّده
